server:
  port: 8888
  host: ${SERVER_HOST:localhost}
  tomcat:
    connection-timeout: 2s
    keep-alive-timeout: 15s
    threads:
      max: 50
      min: 10

spring:
  application:
    name: config-service
  profiles:
    active: composite
  cloud:
    config:
      server:
        encrypt:
          enabled: false
        composite:
          # AWS Secrets Manager - Higher priority (order: 1)
          - type: awssecretsmanager
            region: ap-southeast-2
            prefix: /config-secrets
            profileSeparator: /
            order: 1
          # AWS S3 - Lower priority (order: 2)
          - type: awss3
            region: ap-southeast-2
            bucket: test-kunal-pii-logs
            useDirectoryLayout: true
            order: 2
        # Disable fail-fast if you want the server to continue even if one backend fails
        failOnCompositeError: true

# Management endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

aws:
  region: ap-southeast-2
  retry:
    max-attempts: 3
    backoff:
      base-delay: 100ms
      max-backoff-time: 20s

encrypt:
  key: "arn:aws:kms:ap-southeast-2:721431533455:key/9d3e8af7-0d17-4d8b-9ea6-89bbf643194c"


logging:
  level:
    org.zalando.awsspring.cloud.bootstrap.encrypt: DEBUG
    org.springframework.cloud.config.server.encryption: DEBUG